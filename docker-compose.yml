services:
  music-bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Service name on the compose network; see POT_PROVIDER_URL in music_bot.py.
      POT_PROVIDER_URL: http://pot-provider:4416
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro
    depends_on:
      pot-provider:
        condition: service_healthy

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: pot-provider
    restart: unless-stopped
    pull_policy: always
    # No curl/wget in the image; node is the only way to poke /ping.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 10s
